<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Illustration schématique : annonces + ventes DVF → base SQLite locale → historique des prix et signaux (aucune donnée réelle). -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" fill-opacity=".14"/></pattern>
    <radialGradient id="h" cx="55%" cy="15%" r="80%"><stop offset="0" stop-color="#1fbf74" stop-opacity=".2"/><stop offset="1" stop-color="#07090d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#07090d"/><rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#h)"/>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <!-- Sources : annonces et ventes réelles -->
    <g transform="translate(120 200)">
      <rect width="300" height="150" rx="20" fill="#0d1117" stroke="#94a3b8" stroke-opacity=".35" stroke-width="2"/>
      <text x="30" y="52" font-size="24" fill="#3fe08f">listings</text>
      <rect x="30" y="78" width="180" height="12" rx="6" fill="#94a3b8" fill-opacity=".3"/>
      <rect x="30" y="106" width="120" height="12" rx="6" fill="#94a3b8" fill-opacity=".2"/>
      <rect x="196" y="98" width="76" height="30" rx="8" fill="#3fe08f" fill-opacity=".15" stroke="#3fe08f" stroke-opacity=".5"/>
      <text x="234" y="119" font-size="16" fill="#3fe08f" text-anchor="middle">€/m²</text>
    </g>
    <g transform="translate(120 390)">
      <rect width="300" height="150" rx="20" fill="#0d1117" stroke="#94a3b8" stroke-opacity=".35" stroke-width="2"/>
      <text x="30" y="52" font-size="24" fill="#c4a7ff">browser ext.</text>
      <rect x="30" y="78" width="210" height="12" rx="6" fill="#94a3b8" fill-opacity=".3"/>
      <rect x="30" y="106" width="150" height="12" rx="6" fill="#94a3b8" fill-opacity=".2"/>
    </g>
    <g transform="translate(120 580)">
      <rect width="300" height="150" rx="20" fill="#0d1117" stroke="#4fd1b5" stroke-opacity=".4" stroke-width="2"/>
      <text x="30" y="52" font-size="24" fill="#4fd1b5">DVF open data</text>
      <text x="30" y="96" font-size="17" fill="#8090ab">real sales · 12 m</text>
      <rect x="30" y="114" width="160" height="12" rx="6" fill="#4fd1b5" fill-opacity=".25"/>
    </g>

    <path d="M440 275 C520 275 520 430 600 450" fill="none" stroke="#3fe08f" stroke-width="3"/>
    <path d="M440 465 H600" stroke="#c4a7ff" stroke-width="3"/>
    <path d="M440 655 C520 655 520 480 600 470" fill="none" stroke="#4fd1b5" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M588 452l15 10-15 10" fill="none" stroke="#3fe08f" stroke-width="3"/>

    <!-- Base locale -->
    <g transform="translate(620 360)">
      <ellipse cx="110" cy="20" rx="110" ry="26" fill="#0d1117" stroke="#3fe08f" stroke-opacity=".6" stroke-width="2"/>
      <path d="M0 20 V170 C0 205 220 205 220 170 V20" fill="#0d1117" stroke="#3fe08f" stroke-opacity=".6" stroke-width="2"/>
      <path d="M0 70 C0 105 220 105 220 70 M0 120 C0 155 220 155 220 120" fill="none" stroke="#3fe08f" stroke-opacity=".3" stroke-width="2"/>
      <text x="110" y="255" font-size="22" fill="#eef1f5" text-anchor="middle">SQLite</text>
      <text x="110" y="288" font-size="17" fill="#8090ab" text-anchor="middle">127.0.0.1 only</text>
    </g>

    <path d="M860 465 H940" stroke="#3fe08f" stroke-width="3"/><path d="M925 453l15 12-15 12" fill="none" stroke="#3fe08f" stroke-width="3"/>

    <!-- Historique des prix -->
    <g transform="translate(960 170)">
      <rect width="520" height="330" rx="22" fill="#070b14" stroke="#3fe08f" stroke-opacity=".5" stroke-width="2"/>
      <text x="36" y="56" font-size="22" fill="#3fe08f">price history</text>
      <path d="M36 270 H484" stroke="#94a3b8" stroke-opacity=".25" stroke-width="2"/>
      <path d="M36 220 H484" stroke="#4fd1b5" stroke-opacity=".5" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="484" y="210" font-size="15" fill="#4fd1b5" text-anchor="end">DVF median</text>
      <path d="M50 110 H170 V140 H290 V175 H380 V240 H470" fill="none" stroke="#eef1f5" stroke-opacity=".85" stroke-width="4" stroke-linejoin="round"/>
      <g fill="#f2b45a"><circle cx="170" cy="140" r="7"/><circle cx="290" cy="175" r="7"/><circle cx="380" cy="240" r="7"/></g>
      <g font-size="15" fill="#f2b45a"><text x="180" y="132">▼</text><text x="300" y="167">▼</text><text x="390" y="232">▼</text></g>
    </g>

    <!-- Signaux -->
    <g transform="translate(960 540)">
      <rect width="250" height="190" rx="20" fill="#4fd1b5" fill-opacity=".08" stroke="#4fd1b5" stroke-opacity=".5" stroke-width="2"/>
      <text x="30" y="58" font-size="20" fill="#4fd1b5">below market</text>
      <rect x="30" y="86" width="150" height="12" rx="6" fill="#4fd1b5" fill-opacity=".35"/>
      <rect x="30" y="114" width="100" height="12" rx="6" fill="#4fd1b5" fill-opacity=".2"/>
      <text x="30" y="164" font-size="17" fill="#8090ab">vs. real sales</text>
    </g>
    <g transform="translate(1230 540)">
      <rect width="250" height="190" rx="20" fill="#0d1117" stroke="#f2b45a" stroke-opacity=".45" stroke-width="2"/>
      <text x="30" y="58" font-size="20" fill="#f2b45a">price drops</text>
      <rect x="30" y="86" width="170" height="12" rx="6" fill="#f2b45a" fill-opacity=".35"/>
      <rect x="30" y="114" width="120" height="12" rx="6" fill="#f2b45a" fill-opacity=".2"/>
      <text x="30" y="164" font-size="17" fill="#8090ab">every 6 h</text>
    </g>
  </g>
</svg>
