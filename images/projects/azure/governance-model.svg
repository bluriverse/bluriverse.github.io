<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Schéma générique et fictif d'un modèle de gouvernance Azure. -->
  <rect width="1600" height="900" fill="#07090d"/>
  <g font-family="IBM Plex Mono, Consolas, monospace">
    <text x="80" y="90" font-size="22" fill="#8090ab">GENERIC MODEL · FICTITIOUS EXAMPLE</text>
    <!-- Colonne 1 : définir -->
    <rect x="80" y="150" width="420" height="640" rx="22" fill="#0d1117" stroke="#3fe08f" stroke-opacity=".45" stroke-width="2"/>
    <text x="120" y="210" font-size="26" fill="#3fe08f">1 · Define</text>
    <g font-size="21" fill="#eef1f5"><text x="120" y="290">Policy definitions</text><text x="120" y="340">Initiatives</text><text x="120" y="390">RBAC roles</text><text x="120" y="440">Access groups</text></g>
    <text x="120" y="740" font-size="18" fill="#8090ab">at management group level</text>
    <!-- Colonne 2 : appliquer -->
    <rect x="590" y="150" width="420" height="640" rx="22" fill="#0d1117" stroke="#94a3b8" stroke-opacity=".35" stroke-width="2"/>
    <text x="630" y="210" font-size="26" fill="#eef1f5">2 · Inherit</text>
    <g font-size="20" fill="#a3acb9">
      <rect x="630" y="260" width="340" height="70" rx="12" fill="none" stroke="#94a3b8" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="655" y="303">subscription A</text>
      <rect x="630" y="350" width="340" height="70" rx="12" fill="none" stroke="#94a3b8" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="655" y="393">subscription B</text>
      <rect x="630" y="440" width="340" height="70" rx="12" fill="none" stroke="#94a3b8" stroke-opacity=".3" stroke-dasharray="6 6"/><text x="655" y="483">subscription C</text>
    </g>
    <text x="630" y="740" font-size="18" fill="#8090ab">least privilege via groups</text>
    <!-- Colonne 3 : mesurer -->
    <rect x="1100" y="150" width="420" height="640" rx="22" fill="#4fd1b5" fill-opacity=".05" stroke="#4fd1b5" stroke-opacity=".45" stroke-width="2"/>
    <text x="1140" y="210" font-size="26" fill="#4fd1b5">3 · Measure</text>
    <g>
      <text x="1140" y="290" font-size="18" fill="#a3acb9">compliant</text><rect x="1140" y="305" width="300" height="18" rx="9" fill="#4fd1b5" fill-opacity=".6"/>
      <text x="1140" y="370" font-size="18" fill="#a3acb9">to review</text><rect x="1140" y="385" width="130" height="18" rx="9" fill="#f2b45a" fill-opacity=".65"/>
      <text x="1140" y="450" font-size="18" fill="#a3acb9">exempted</text><rect x="1140" y="465" width="60" height="18" rx="9" fill="#94a3b8" fill-opacity=".35"/>
    </g>
    <text x="1140" y="740" font-size="18" fill="#8090ab">dashboards · reporting</text>
    <path d="M505 470h80M1015 470h80" stroke="#3fe08f" stroke-width="3"/>
  </g>
</svg>
